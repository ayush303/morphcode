<svg width="900" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Main text gradient: fuchsia → violet → blue → cyan -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E879F9"/>
      <stop offset="22%"  stop-color="#A855F7"/>
      <stop offset="45%"  stop-color="#6366F1"/>
      <stop offset="68%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D0820"/>
      <stop offset="100%" stop-color="#06111F"/>
    </linearGradient>

    <!-- Soft purple glow on the text -->
    <filter id="glow" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>

    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>

  </defs>

  <!-- Dark background -->
  <rect width="900" height="180" rx="18" fill="url(#bgGrad)"/>

  <!-- Dot grid overlay -->
  <rect width="900" height="180" rx="18" fill="url(#dots)"/>

  <!-- Gradient border (1.5px) -->
  <rect x="0.75" y="0.75" width="898.5" height="178.5" rx="17.25"
        fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left ambient glow blob -->
  <ellipse cx="110" cy="90" rx="90" ry="60" fill="#A855F7" opacity="0.10"/>

  <!-- Right ambient glow blob -->
  <ellipse cx="790" cy="90" rx="90" ry="60" fill="#22D3EE" opacity="0.10"/>

  <!-- Centre ambient glow under the text -->
  <ellipse cx="450" cy="115" rx="260" ry="40" fill="#6366F1" opacity="0.08"/>

  <!-- MORPHCODE main text -->
  <text
    x="450" y="112"
    font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
    font-size="88"
    font-weight="900"
    letter-spacing="10"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >MORPHCODE</text>

  <!-- Tagline -->
  <text
    x="450" y="148"
    font-family="'Arial', Helvetica, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#94A3B8"
  >AI · POWERED · REACT · IDE</text>

  <!-- Decorative left line -->
  <line x1="60" y1="148" x2="220" y2="148" stroke="url(#borderGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Decorative right line -->
  <line x1="680" y1="148" x2="840" y2="148" stroke="url(#borderGrad)" stroke-width="0.8" opacity="0.5"/>

</svg>
